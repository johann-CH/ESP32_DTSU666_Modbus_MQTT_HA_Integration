# file: /config/mqtt.yaml (Prod)

sensor:
  # Smart Meter DTSU666 Converter States
  - name: 'DTSU666 Converter Modbus Error 0xE0 (Invalid Slave ID)'
    unique_id: dtsu666_converter_modbus_error_0xe0
    state_topic: 'DTSU666/DTSU666_Modbus_Converter_Error_0xE0'
    icon: 'mdi:counter'
    value_template: '{{ value_json.DTSU666_Modbus_Converter_Error_0xE0 }}'
    
  - name: 'DTSU666 Converter Modbus Error 0xE1 (Invalid Function)'
    unique_id: dtsu666_converter_modbus_error_0xe1
    state_topic: 'DTSU666/DTSU666_Modbus_Converter_Error_0xE1'
    icon: 'mdi:counter'
    value_template: '{{ value_json.DTSU666_Modbus_Converter_Error_0xE1 }}'
    
  - name: 'DTSU666 Converter Modbus Error 0xE2 (Responce Timeout)'
    unique_id: dtsu666_converter_modbus_error_0xe2
    state_topic: 'DTSU666/DTSU666_Modbus_Converter_Error_0xE2'
    icon: 'mdi:counter'
    value_template: '{{ value_json.DTSU666_Modbus_Converter_Error_0xE2 }}'
    
  - name: 'DTSU666 Converter Modbus Error 0xE3 (Invalid CRC)'
    unique_id: dtsu666_converter_modbus_error_0xe3
    state_topic: 'DTSU666/DTSU666_Modbus_Converter_Error_0xE3'
    icon: 'mdi:counter'
    value_template: '{{ value_json.DTSU666_Modbus_Converter_Error_0xE3 }}'
    
  - name: 'DTSU666 Converter MQTT Keep Alive'
    unique_id: dtsu666_converter_mqtt_keep_alive
    state_topic: 'DTSU666/DTSU666_Modbus_Converter_MQTT_Keep_Alive'
    icon: 'mdi:counter'
    value_template: '{{ value_json.DTSU666_Modbus_Converter_MQTT_Keep_Alive }}'
    
  - name: 'DTSU666 Converter MQTT Keep Alive Received'
    unique_id: dtsu666_converter_mqtt_keep_alive_received
    state_topic: 'DTSU666/DTSU666_Modbus_Converter_MQTT_Keep_Alive_Received'
    icon: 'mdi:counter'
    value_template: '{{ value_json.DTSU666_Modbus_Converter_MQTT_Keep_Alive_Received }}'
    
  - name: 'DTSU666 Converter MQTT Keep Alive Delayed'
    unique_id: dtsu666_converter_mqtt_keep_alive_delayed
    state_topic: 'DTSU666/DTSU666_Modbus_Converter_MQTT_Keep_Alive_Delayed'
    icon: 'mdi:counter'
    value_template: '{{ value_json.DTSU666_Modbus_Converter_MQTT_Keep_Alive_Delayed }}'
    
  # Smart Meter DTSU666 Data
  # - Register Block System
  - name: 'Smart Meter DTSU666 Software Revision'
    unique_id: dtsu666_software_revision
    state_topic: 'DTSU666/Software_Revision'
    state_class: measurement
    value_template: '{{ value_json.Software_Revision }}'
    
  - name: 'Smart Meter DTSU666 Programming Code'
    unique_id: dtsu666_programming_code
    state_topic: 'DTSU666/Programming_Code'
    state_class: measurement
    value_template: '{{ value_json.Programming_Code }}'
    
  - name: 'Smart Meter DTSU666 Power Reset'
    unique_id: dtsu666_power_reset
    state_topic: 'DTSU666/Power_Reset'
    state_class: measurement
    value_template: '{{ value_json.Power_Reset }}'
    
  - name: 'Smart Meter DTSU666 Wire Selection'
    unique_id: dtsu666_wire_selection
    state_topic: 'DTSU666/Wire_Selection'
    state_class: measurement
    value_template: '{{ value_json.Wire_Selection }}'
    
  - name: 'Smart Meter DTSU666 Transformer Rate IrAt'
    unique_id: dtsu666_transformer_rate_irat
    state_topic: 'DTSU666/Transformer_Rate_IrAt'
    state_class: measurement
    value_template: '{{ value_json.Transformer_Rate_IrAt }}'
    
  - name: 'Smart Meter DTSU666 Transformer Rate IrUt'
    unique_id: dtsu666_transformer_rate_irut
