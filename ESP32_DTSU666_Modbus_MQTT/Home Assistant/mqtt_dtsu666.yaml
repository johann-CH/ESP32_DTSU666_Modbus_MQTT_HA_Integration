    state_class: measurement
    value_template: '{{ value_json.Display_Rotation_Time }}'
    
  - name: 'Smart Meter DTSU666 LCD Backlight Time'
    unique_id: dtsu666_lcd_backlight_time
    state_topic: 'DTSU666/LCD_Backlight_Time'
    state_class: measurement
    value_template: '{{ value_json.LCD_Backlight_Time }}'
    
  - name: 'Smart Meter DTSU666 Reserve'
    unique_id: dtsu666_reserve
    state_topic: 'DTSU666/Reserve'
    state_class: measurement
    value_template: '{{ value_json.Reserve }}'

  - name: 'Smart Meter DTSU666 Protocol'
