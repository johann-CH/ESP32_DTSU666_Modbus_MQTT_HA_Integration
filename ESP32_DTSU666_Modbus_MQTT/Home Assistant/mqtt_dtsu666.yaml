  - name: 'Smart Meter DTSU666 Modbus Address'
    unique_id: dtsu666_modbus_address
    state_topic: 'DTSU666/Modbus_Address'
    state_class: measurement
    value_template: '{{ value_json.Modbus_Address }}'
    
